# Stable channel: release-please keeps a Release PR open from conventional commits on main. Merging it tags
# vX.Y.Z and creates the GitHub release; this run then builds from the tag (MinVer stamps X.Y.Z), attaches the
# binaries and installers, and publishes npm "latest". The build stays in this run because releases created
# with GITHUB_TOKEN do not trigger other workflows.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.release-please.outputs.tag_name }}

  github-release:
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: assets
          path: assets
      - name: Attach binaries and installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ needs.release-please.outputs.tag_name }}" assets/* --repo "$GITHUB_REPOSITORY" --clobber

  npm:
    if: vars.NPM_PUBLISH == 'true'
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: tgz
      - name: Publish (platform packages first, then the launcher)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm install -g npm@latest
          for f in tgz/blearn-win32-*.tgz tgz/blearn-linux-*.tgz tgz/blearn-darwin-*.tgz; do npm publish "$f" --access public --provenance; done
          npm publish "tgz/blearn-${{ needs.build.outputs.version }}.tgz" --access public --provenance
