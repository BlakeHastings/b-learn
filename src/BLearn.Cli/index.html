<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>b-learn</title>
<style>
  :root {
    --bg: #f7f6f2; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a65; --line: #e2e0d8;
    --down: #2f6fb3; --up: #8a5a1f; --lateral: #5d7a3a; --stub: #9a978c; --accent: #2f6fb3;
    --tip-bg: #fffdf7; --shadow: 0 6px 24px rgba(0,0,0,.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --panel: #1f1f23; --ink: #e8e6e0; --muted: #9c9a93; --line: #34343a;
      --down: #7fb0e8; --up: #e0ae6c; --lateral: #a7c97d; --stub: #77756e; --accent: #7fb0e8;
      --tip-bg: #26262b; --shadow: 0 6px 24px rgba(0,0,0,.5);
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 10px 20px; }
  .top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .brand { font-weight: 700; }
  .brand small { font-weight: 400; color: var(--muted); margin-left: 6px; }
  .health { margin-left: auto; font-size: 13px; color: var(--muted); }
  .health.bad { color: #c0392b; font-weight: 600; }
  .trail { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; margin-top: 6px; font-size: 13px; }
  .trail button { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 999px; padding: 2px 10px; cursor: pointer; font: inherit; }
  .trail button.here { border-color: var(--accent); font-weight: 600; }
  .trail .step { color: var(--muted); font-size: 12px; }
  .depth { font-size: 12px; color: var(--muted); margin-left: 8px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 24px; max-width: 1180px; margin: 0 auto; padding: 24px 20px 80px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
  article { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 24px 28px; min-width: 0; }
  h1 { margin: 0 0 4px; font-size: 30px; line-height: 1.2; }
  .gloss { color: var(--muted); font-style: italic; margin: 0 0 18px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 6px; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; overflow-x: auto; font-size: 14px; }
  code { font-family: ui-monospace, "Cascadia Code", Consolas, monospace; font-size: .92em; }
  .arrival { display: inline-block; font-size: 12px; margin-bottom: 8px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  a.wl { color: var(--accent); text-decoration: none; border-bottom: 1px dotted currentColor; cursor: pointer; }
  a.wl.stub { color: var(--stub); border-bottom-style: dashed; }
  .wl.broken { color: #c0392b; text-decoration: line-through; }
  aside section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  aside h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .08em; }
  aside h3.down { color: var(--down); } aside h3.up { color: var(--up); } aside h3.lateral { color: var(--lateral); }
  aside ul { list-style: none; margin: 0; padding: 0; }
  aside li { padding: 5px 0; border-top: 1px solid var(--line); font-size: 14px; }
  aside li:first-child { border-top: 0; }
  aside .label { display: block; font-size: 11px; color: var(--muted); }
  aside .empty { color: var(--muted); font-size: 13px; font-style: italic; }
  .badge { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 7px; border-radius: 999px; color: #fff; vertical-align: middle; }
  .badge.down { background: var(--down); } .badge.up { background: var(--up); } .badge.lateral { background: var(--lateral); }
  .badge.stubb { background: transparent; color: var(--stub); border: 1px dashed var(--stub); }
  .stubbox { border: 1px dashed var(--stub); border-radius: 8px; padding: 16px; color: var(--muted); }
  .shimmer { height: 12px; border-radius: 4px; margin: 10px 0; background: linear-gradient(90deg, var(--line) 25%, var(--bg) 50%, var(--line) 75%); background-size: 200% 100%; animation: sh 1.4s infinite linear; }
  @keyframes sh { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  .return { background: var(--bg); border-left: 3px solid var(--up); padding: 8px 12px; margin-bottom: 14px; font-size: 14px; color: var(--muted); }
  .tip { position: fixed; z-index: 20; width: 380px; max-width: calc(100vw - 24px); max-height: 60vh; overflow: auto; background: var(--tip-bg); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow); padding: 12px 14px; font-size: 14px; line-height: 1.5; }
  .tip .tt { font-weight: 700; font-size: 15px; margin-right: 6px; }
  .tip .tg { color: var(--muted); font-style: italic; margin: 6px 0; }
  .tip .ts p { margin: 6px 0; }
  .tip .hint { font-size: 11px; color: var(--muted); margin-top: 8px; border-top: 1px solid var(--line); padding-top: 6px; }
  .tip.level-2 { border-color: var(--accent); } .tip.level-3, .tip.level-4 { border-color: var(--up); }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">b-learn<small id="project"></small></span>
    <span class="health" id="health"></span>
  </div>
  <div class="trail" id="trail"></div>
</header>
<main>
  <article id="note"></article>
  <aside id="side"></aside>
</main>
<script>
const ARROW = { down: "↓ deeper", up: "↑ up", lateral: "↔ sideways" };
const cache = new Map();
let project = null;
let trail = [];          // [{id, title, via}] the journey so far; via = direction taken to arrive
let current = null;

async function fetchNote(id, from) {
  const key = id + "|" + (from || "");
  if (!cache.has(key)) {
    const url = `/api/notes/${encodeURIComponent(id)}` + (from ? `?from=${encodeURIComponent(from)}` : "");
    cache.set(key, fetch(url).then(r => r.ok ? r.json() : null));
  }
  return cache.get(key);
}

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function badge(dir) { return dir ? `<span class="badge ${dir}">${ARROW[dir]}</span>` : ""; }

function logJourney(evt) {
  fetch("/api/journey", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(evt) }).catch(() => {});
}

// ---------- navigation ----------
async function go(id, { fromTrailIndex } = {}) {
  closeTips(0);
  const from = current?.id;
  const note = await fetchNote(id, from);
  if (!note) { document.getElementById("note").innerHTML = `<p>No note <code>${esc(id)}</code>.</p>`; return; }

  const via = note.relation?.direction || null;
  let returningFrom = null;
  if (fromTrailIndex !== undefined) {
    returningFrom = trail[trail.length - 1];
    trail = trail.slice(0, fromTrailIndex + 1);
  } else if (trail.length >= 2 && trail[trail.length - 2].id === id) {
    returningFrom = trail.pop();
  } else if (!trail.length || trail[trail.length - 1].id !== id) {
    trail.push({ id: note.id, title: note.title, via });
  }
  if (returningFrom?.id === id) returningFrom = null;
  if (from && from !== id) logJourney({ from, to: id, direction: via, kind: fromTrailIndex !== undefined ? "trail" : "link" });

  current = note;
  try { sessionStorage.setItem("blearn.trail", JSON.stringify(trail)); } catch {}
  renderTrail();
  renderNote(note, returningFrom);
  renderSide(note);
  window.scrollTo(0, 0);
}

function depthOf(t) {
  let d = 0;
  for (const s of t) d += s.via === "down" ? 1 : s.via === "up" ? -1 : 0;
  return d;
}

function renderTrail() {
  const el = document.getElementById("trail");
  el.innerHTML = trail.map((s, i) => {
    const step = i === 0 ? "" : `<span class="step">${s.via === "down" ? "↓" : s.via === "up" ? "↑" : s.via === "lateral" ? "↔" : "·"}</span>`;
    return `${step}<button data-i="${i}" class="${i === trail.length - 1 ? "here" : ""}">${esc(s.title)}</button>`;
  }).join("") + `<span class="depth">depth ${depthOf(trail)}</span>`;
  el.querySelectorAll("button").forEach(b => b.onclick = () => {
    const i = +b.dataset.i;
    if (i !== trail.length - 1) go(trail[i].id, { fromTrailIndex: i });
  });
}

function renderNote(n, returningFrom) {
  const el = document.getElementById("note");
  const arrival = n.relation ? `<span class="arrival">arrived via <b>${esc(n.relation.label)}</b> ${ARROW[n.relation.direction]}</span>` : "";
  const ret = returningFrom ? `<div class="return">Back from <b>${esc(returningFrom.title)}</b>. Re-read this with that in mind.</div>` : "";
  if (n.status === "stub") {
    el.innerHTML = `${ret}${arrival}<h1>${esc(n.title)}</h1><p class="gloss">${esc(n.gloss)}</p>
      <div class="stubbox"><b>Not researched yet.</b> In the full system a researcher would be expanding this concept now.
      <div class="shimmer"></div><div class="shimmer" style="width:80%"></div><div class="shimmer" style="width:60%"></div></div>`;
    return;
  }
  el.innerHTML = `${ret}${arrival}<h1>${esc(n.title)}</h1><p class="gloss">${esc(n.gloss)}</p>
    <h2>Summary</h2>${n.summaryHtml}<h2>Detail</h2>${n.detailHtml}`;
}

function renderSide(n) {
  const groups = { down: [], lateral: [], up: [] };
  for (const nb of n.neighbors) groups[nb.direction].push(nb);
  const titles = { down: "Deeper ↓", lateral: "Sideways ↔", up: "Up ↑" };
  document.getElementById("side").innerHTML = ["down", "lateral", "up"].map(d => `
    <section><h3 class="${d}">${titles[d]}</h3>
      ${groups[d].length ? `<ul>${groups[d].map(nb => `<li>
        <a class="wl${nb.status === "stub" ? " stub" : ""}" data-id="${esc(nb.id)}" href="#/note/${esc(nb.id)}">${esc(nb.title)}</a>
        <span class="label">${esc(nb.label)}${nb.status === "stub" ? " · stub" : ""}</span></li>`).join("")}</ul>`
      : `<div class="empty">${d === "down" ? "Nothing deeper yet." : "None."}</div>`}
    </section>`).join("");
}

// ---------- nested tooltips ----------
// tips[k] is the tooltip at level k+1. A link inside level k opens level k+1.
const tips = [];
let openTimer = null, trimTimer = null;

function levelOf(node) {
  const t = node.closest?.(".tip");
  return t ? +t.dataset.level : 0;
}

function contextNoteId(node) {
  const t = node.closest?.(".tip");
  return t ? t.dataset.id : current?.id;
}

function closeTips(keep) {
  while (tips.length > keep) tips.pop().remove();
}

async function openTip(link) {
  const level = levelOf(link);
  const id = link.dataset.id;
  const from = contextNoteId(link);
  const n = await fetchNote(id, from);
  if (!n) return;
  closeTips(level);
  const tip = document.createElement("div");
  tip.className = `tip level-${level + 1}`;
  tip.dataset.level = level + 1;
  tip.dataset.id = id;
  const rel = n.relation;
  tip.innerHTML = `<div><span class="tt">${esc(n.title)}</span>${badge(rel?.direction)}${n.status === "stub" ? ' <span class="badge stubb">stub</span>' : ""}</div>
    ${rel ? `<div class="hint" style="border:0;margin:2px 0 0;padding:0">${esc(rel.label)} (from ${esc(from)})</div>` : ""}
    <div class="tg">${esc(n.gloss)}</div>
    ${n.status === "stub" ? "" : `<div class="ts">${n.summaryHtml}</div>`}
    <div class="hint">Hover links to go further · click to dive in · Esc closes</div>`;
  document.body.appendChild(tip);
  place(tip, link.getBoundingClientRect());
  tips.push(tip);
}

function place(tip, r) {
  const w = tip.offsetWidth, h = tip.offsetHeight, pad = 8;
  let left = Math.min(Math.max(pad, r.left), window.innerWidth - w - pad);
  let top = r.bottom + 6;
  if (top + h > window.innerHeight - pad) top = Math.max(pad, r.top - h - 6);
  tip.style.left = left + "px";
  tip.style.top = top + "px";
}

document.addEventListener("mouseover", e => {
  const link = e.target.closest?.("a.wl");
  const level = levelOf(e.target);
  clearTimeout(openTimer);
  if (link) {
    const already = tips[level] && tips[level].dataset.id === link.dataset.id;
    if (!already) openTimer = setTimeout(() => openTip(link), 220);
  }
  // Keep every tooltip up to the one under the pointer (plus the one a hovered link owns).
  const keep = link ? level + 1 : level;
  clearTimeout(trimTimer);
  trimTimer = setTimeout(() => closeTips(keep), 380);
});

document.addEventListener("click", e => {
  const link = e.target.closest?.("a.wl");
  if (!link) return;
  e.preventDefault();
  go(link.dataset.id);
  history.pushState(null, "", `#/note/${link.dataset.id}`);
});

document.addEventListener("keydown", e => { if (e.key === "Escape") closeTips(0); });
window.addEventListener("popstate", () => { const id = idFromHash(); if (id) go(id); });
window.addEventListener("scroll", () => closeTips(0), { passive: true });

function idFromHash() { const m = location.hash.match(/^#\/note\/(.+)$/); return m ? decodeURIComponent(m[1]) : null; }

// ---------- boot ----------
(async () => {
  project = await fetch("/api/project").then(r => r.json());
  document.getElementById("project").textContent = project.name;
  const h = document.getElementById("health");
  h.textContent = `${project.noteCount} notes · ${project.errors} errors · ${project.warnings} warnings`;
  if (project.errors) h.classList.add("bad");
  try { trail = JSON.parse(sessionStorage.getItem("blearn.trail") || "[]"); } catch { trail = []; }
  const start = idFromHash() || project.root;
  if (trail.length && trail[trail.length - 1].id === start) trail.pop();
  go(start);
})();
</script>
</body>
</html>
