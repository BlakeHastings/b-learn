# Builds every platform binary and the npm packages, then proves `npx blearn` works on Linux, macOS and Windows.
# Called by edge.yml and release.yml. The version comes from git tags (MinVer), so history must be fetched.
name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Commit or tag to build (defaults to the triggering commit).
        type: string
        default: ""
    outputs:
      version:
        description: The version stamped into the build.
        value: ${{ jobs.binaries.outputs.version }}

permissions:
  contents: read

jobs:
  binaries:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0 # MinVer reads tags and history

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Test
        run: dotnet test -c Release

      - name: Publish single-file binaries
        run: |
          for rid in win-x64 win-arm64 linux-x64 linux-arm64 osx-x64 osx-arm64; do
            dotnet publish src/BLearn.Cli -c Release -r "$rid" -o "dist/$rid"
          done

      - name: Read version
        id: version
        run: echo "version=$(dist/linux-x64/blearn --version)" >> "$GITHUB_OUTPUT"

      - name: Name release assets
        run: |
          mkdir -p assets
          for rid in win-x64 win-arm64; do cp "dist/$rid/blearn.exe" "assets/blearn-$rid.exe"; done
          for rid in linux-x64 linux-arm64 osx-x64 osx-arm64; do cp "dist/$rid/blearn" "assets/blearn-$rid"; done
          cp install/install.sh install/install.ps1 assets/
          (cd assets && sha256sum * > SHA256SUMS)

      - name: Build npm packages
        run: |
          node npm/build.mjs --version "${{ steps.version.outputs.version }}" --dist dist --out out/npm
          mkdir -p out/tgz
          for d in out/npm/*; do (cd "$d" && npm pack --pack-destination ../../tgz); done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: assets
          path: assets/
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm
          path: out/tgz/
          if-no-files-found: error

  npx-smoke:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm
          path: tgz

      - name: Install from the packed tarballs and run
        shell: bash
        run: |
          version="${{ needs.binaries.outputs.version }}"
          platform=$(node -p 'process.platform + "-" + process.arch')
          mkdir app && cd app && npm init -y > /dev/null
          npm install --no-audit --no-fund "../tgz/blearn-$platform-$version.tgz" "../tgz/blearn-$version.tgz"
          test "$(npx blearn --version)" = "$version"
          npx blearn store post ./smoke.blearn --name Smoke --root-title Rust --root-gloss "A language."
          npx blearn concept list --store ./smoke.blearn | grep -q '"id": "rust"'
